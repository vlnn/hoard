[project]
name = "hoard"
version = "1.1.0"
description = "A library for building Alfred workflows over collections of things: one kind per repository, one kernel shared by all."
readme = "README.md"
authors = [{ name = "Volodymyr Anokhin" }]
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "pytest-mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: performance budgets, run before each release"]
